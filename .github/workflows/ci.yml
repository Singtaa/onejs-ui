name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Report both platforms rather than stopping at the first red one: a
      # failure on one OS is usually the interesting result, not a reason to
      # hide the other.
      fail-fast: false
      matrix:
        # Windows is deliberate, not symmetry. Developers here work on Windows, so it has to be a gate and not an afterthought.
        os: [ubuntu-latest, windows-latest]

    defaults:
      run:
        working-directory: onejs-ui

    steps:
      # Checked out into a named folder so the siblings below sit beside it.
      # onejs-ui depends on them through "file:../" specifiers, which is the layout
      # the packages are developed in inside the container repo; a lone checkout
      # resolves none of them and fails before any test runs.
      - uses: actions/checkout@v4
        with:
          path: onejs-ui

      - uses: actions/checkout@v4
        with:
          repository: Singtaa/onejs-react
          ref: main
          path: onejs-react

      - uses: actions/checkout@v4
        with:
          repository: Singtaa/unity-types
          ref: main
          path: unity-types

      - uses: actions/setup-node@v4
        with:
          # 22 rather than 20 because `npm test` runs the suite straight from
          # TypeScript with node's own type stripping, which landed in 22.6.
          # The alternative was a transpile step and a test framework to carry
          # it, for one file of pure arithmetic.
          node-version: 22
          cache: npm
          cache-dependency-path: onejs-ui/package-lock.json

      # onejs-react is compiled from source as part of this typecheck, so it needs
      # its own dependencies present: tsc resolves an import inside it
      # relative to that folder, not to this one.
      - run: npm ci
        working-directory: onejs-react

      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint --if-present

      # --if-present: a package with no test script yet is not a failure here,
      # so this workflow starts gating tests the day they are added.
      - run: npm run test --if-present
